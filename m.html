<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> my 30 60 90 3D Pie Chart</title>
        <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
        <script type="text/javascript">
            google.charts.load("current", { packages: ["corechart"] });
            google.charts.setOnLoadCallback(drawChart);

            function drawChart() {
                var data = google.visualization.arrayToDataTable([
                    ['Task', 'days in 3 month'],
                    ['Start Strong:', 93],
                    ['Take Action:', 90],
                    ['Reflect & Adjust', 88],
                    ['Finish Strong:', 90]

                ]);

                var options = {
                    title: ' breakdown Activities of 2025',
                    is3D: true,

                    fontName: 'Arial',
                    fontSize: 14,

                    titleTextStyle: {
                        fontSize: 18,
                        bold: true,

                    }
                };

                var chart = new google.visualization.PieChart(
                    document.getElementById('piechart_3d')
                );
                chart.draw(data, options);
            }
        </script>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #111010;
                color: #333;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }

            h1 {
                font-size: 2rem;
                margin-bottom: 20px;
                text-align: center;
                color: gold;
            }

            #piechart_3d {
                width: 100%;
                color: blue;
                max-width: 900px;
                height: 500px;
                margin: 0 auto;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
                border-radius: 8px;
                background: #ce0404;
                padding: 10px;
            }
        </style>
    </head>

    <body>
        <h1>My 3D Pie Chart</h1>
        <div id="piechart_3d"></div>
    </body>

</html>
